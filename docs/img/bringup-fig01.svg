<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="230" class="sch" viewBox="0 0 800 230" role="img" aria-label="50Ωダミーロードの両端に1SS270Aダイオードを直結して整流し、100pFと100kΩで平滑する検波プローブの回路図">
<style>
svg {
    --ground:    #edf0f0;
    --surface:   #f9fbfa;
    --surface-2: #e2e8e8;
    --ink:       #14181a;
    --ink-2:     #4a5457;
    --ink-3:     #79878b;
    --line:      #c7d0d0;
    --line-soft: #d9e0e0;
    --rf:        #b0561f;
    --mod:       #1c6b78;
    --warn:      #8d2f42;
    --font-display: "IBM Plex Sans Condensed", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  }
@media (prefers-color-scheme: dark) { svg {
    --ground:    #11161a;
    --surface:   #1a2126;
    --surface-2: #232c32;
    --ink:       #e3e9e9;
    --ink-2:     #a5b2b5;
    --ink-3:     #77878d;
    --line:      #35424a;
    --line-soft: #2a343a;
    --rf:        #e08a4e;
    --mod:       #5cb5c2;
    --warn:      #e0808f;
  } }
svg { color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
.dgm { color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
.dgm .bx { fill: var(--surface-2); stroke-width: 1.5; }
.dgm .bx-rf { stroke: var(--rf); }
.dgm .bx-mod { stroke: var(--mod); }
.dgm .t-title { font-size: 13px; font-weight: 700; fill: currentColor; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; letter-spacing: 0.02em; }
.dgm .t-sub { font-size: 10px; fill: var(--ink-3); }
.dgm .t-num { font-size: 9px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-3); }
.dgm .t-lvl { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
.dgm .t-lane { font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.14em; }
.dgm .t-note { font-size: 9.5px; fill: var(--ink-3); }
.dgm .ln-rf { stroke: var(--rf); stroke-width: 1.8; fill: none; }
.dgm .ln-mod { stroke: var(--mod); stroke-width: 1.8; fill: none; }
.dgm .ln-dash { stroke: var(--ink-3); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
.dgm .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.sch { color: var(--ink); }
.sch .w { stroke: currentColor; stroke-width: 1.4; fill: none; stroke-linecap: round; }
.sch .cmp { stroke: currentColor; stroke-width: 1.4; fill: var(--surface); }
.sch .cmp-f { stroke: currentColor; stroke-width: 1.4; fill: currentColor; }
.sch .ref { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--rf); }
.sch .val { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
.sch .nm  { font-size: 11px; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 600; fill: currentColor; }
.sch .nt  { font-size: 9.5px; fill: var(--ink-3); }
.sch .rail { stroke: var(--mod); stroke-width: 2; fill: none; }
.sch .railtx { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mod); }
.sch .dot { fill: currentColor; }
</style>
<rect x="0" y="0" width="800" height="230" style="fill:var(--surface)"/>

<defs>
<g id="gnd">
<line stroke="currentColor" stroke-width="1.4" x1="-9" x2="9" y1="0" y2="0"></line>
<line stroke="currentColor" stroke-width="1.4" x1="-5.5" x2="5.5" y1="4" y2="4"></line>
<line stroke="currentColor" stroke-width="1.4" x1="-2" x2="2" y1="8" y2="8"></line>
</g>
<marker id="dpAr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M0,0 L9,5 L0,10 z" fill="currentColor"></path>
</marker>
</defs>
<line class="w" marker-end="url(#dpAr)" x1="20" x2="56" y1="110" y2="110"></line>
<text class="nt" x="20" y="98">J14（RG-174）</text>
<line class="w" x1="56" x2="210" y1="110" y2="110"></line>
<circle class="dot" cx="96" cy="110" r="2.6"></circle>
<line class="w" x1="96" x2="96" y1="110" y2="134"></line>
<rect class="cmp" height="40" width="14" x="89" y="134"></rect>
<line class="w" x1="96" x2="96" y1="174" y2="190"></line>
<use href="#gnd" x="96" y="190"></use>
<text class="val" text-anchor="end" x="82" y="152">50Ω</text>
<text class="val" text-anchor="end" x="82" y="165">10W</text>
<line class="w" x1="210" x2="272" y1="110" y2="110"></line>
<text class="nt" text-anchor="middle" x="200" y="96">直結（直流阻止 C は入れない）</text>
<path class="cmp-f" d="M272,99 L272,121 L294,110 Z"></path>
<line class="cmp" x1="294" x2="294" y1="98" y2="122"></line>
<text class="val" text-anchor="middle" x="283" y="88">1SS270A</text>
<line class="w" x1="294" x2="480" y1="110" y2="110"></line>
<circle class="dot" cx="352" cy="110" r="2.6"></circle>
<line class="w" x1="352" x2="352" y1="110" y2="142"></line>
<line class="cmp" x1="340" x2="364" y1="142" y2="142"></line>
<line class="cmp" x1="340" x2="364" y1="149" y2="149"></line>
<line class="w" x1="352" x2="352" y1="149" y2="174"></line>
<use href="#gnd" x="352" y="174"></use>
<text class="val" x="368" y="164">100pF</text>
<circle class="dot" cx="440" cy="110" r="2.6"></circle>
<line class="w" x1="440" x2="440" y1="110" y2="140"></line>
<rect class="cmp" height="40" width="14" x="433" y="140"></rect>
<line class="w" x1="440" x2="440" y1="180" y2="196"></line>
<use href="#gnd" x="440" y="196"></use>
<text class="val" x="456" y="162">100kΩ</text>
<line class="w" marker-end="url(#dpAr)" x1="480" x2="546" y1="110" y2="110"></line>
<text class="nm" x="552" y="106">出力</text>
<text class="nt" x="552" y="122">オシロ ×10 プローブ</text>
<text class="nt" x="552" y="138">または DMM</text>

</svg>
