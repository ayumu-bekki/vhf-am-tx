<text class="nt" x="434" y="52">→ 変調器（3.6V ± 3.6V）</text>
<path class="w" d="M470,110 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0"></path>
<text class="ref" text-anchor="middle" x="505" y="80">L10</text>
<text class="val" text-anchor="middle" x="505" y="68">14 nH</text>
<line class="w" x1="540" x2="574" y1="110" y2="110"></line>
