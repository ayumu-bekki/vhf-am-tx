<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="350" class="sch" viewBox="0 0 880 350" role="img" aria-label="2SC4703からの50Ω入力を33pFと33nHで終段ゲートへ整合し、ドレイン側は14nHと約83pFで50Ωへ変換してLPFへ渡す終段まわりの回路図">
<style>
svg {
    --ground:    #edf0f0;
    --surface:   #f9fbfa;
    --surface-2: #e2e8e8;
    --ink:       #14181a;
    --ink-2:     #4a5457;
    --ink-3:     #79878b;
    --line:      #c7d0d0;
    --line-soft: #d9e0e0;
    --rf:        #b0561f;
    --mod:       #1c6b78;
    --warn:      #8d2f42;
    --font-display: "IBM Plex Sans Condensed", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  }
@media (prefers-color-scheme: dark) { svg {
    --ground:    #11161a;
    --surface:   #1a2126;
    --surface-2: #232c32;
    --ink:       #e3e9e9;
    --ink-2:     #a5b2b5;
    --ink-3:     #77878d;
    --line:      #35424a;
    --line-soft: #2a343a;
    --rf:        #e08a4e;
    --mod:       #5cb5c2;
    --warn:      #e0808f;
  } }
svg { color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
.dgm { color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
.dgm .bx { fill: var(--surface-2); stroke-width: 1.5; }
.dgm .bx-rf { stroke: var(--rf); }
.dgm .bx-mod { stroke: var(--mod); }
.dgm .t-title { font-size: 13px; font-weight: 700; fill: currentColor; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; letter-spacing: 0.02em; }
.dgm .t-sub { font-size: 10px; fill: var(--ink-3); }
.dgm .t-num { font-size: 9px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-3); }
.dgm .t-lvl { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
.dgm .t-lane { font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.14em; }
.dgm .t-note { font-size: 9.5px; fill: var(--ink-3); }
.dgm .ln-rf { stroke: var(--rf); stroke-width: 1.8; fill: none; }
.dgm .ln-mod { stroke: var(--mod); stroke-width: 1.8; fill: none; }
.dgm .ln-dash { stroke: var(--ink-3); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
.dgm .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.sch { color: var(--ink); }
.sch .w { stroke: currentColor; stroke-width: 1.4; fill: none; stroke-linecap: round; }
.sch .cmp { stroke: currentColor; stroke-width: 1.4; fill: var(--surface); }
.sch .cmp-f { stroke: currentColor; stroke-width: 1.4; fill: currentColor; }
.sch .ref { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--rf); }
.sch .val { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
.sch .nm  { font-size: 11px; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 600; fill: currentColor; }
.sch .nt  { font-size: 9.5px; fill: var(--ink-3); }
.sch .rail { stroke: var(--mod); stroke-width: 2; fill: none; }
.sch .railtx { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mod); }
.sch .dot { fill: currentColor; }
</style>
<rect x="0" y="0" width="880" height="350" style="fill:var(--surface)"/>

<defs>
