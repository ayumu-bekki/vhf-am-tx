<text class="nm" x="424" y="196">HTL7G06S006P</text>
<line class="w" x1="378" x2="470" y1="110" y2="110"></line>
<circle class="dot" cx="420" cy="110" r="2.6"></circle>
<path class="w" d="M420,110 q14,-8 0,-16 q14,-8 0,-16"></path>
