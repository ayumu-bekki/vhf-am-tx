<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="210" class="sch" viewBox="0 0 900 210" role="img" aria-label="Si5351A の出力に3dBのπ型パッドを入れ、1000pFの直流阻止コンデンサを経て、22pFのシャントと47nHの直列インダクタを3組並べた定数k形ローパスフィルタで2SC4703へ渡す回路図">
<style>
svg {
    --ground:    #edf0f0;
    --surface:   #f9fbfa;
    --surface-2: #e2e8e8;
    --ink:       #14181a;
    --ink-2:     #4a5457;
    --ink-3:     #79878b;
    --line:      #c7d0d0;
    --line-soft: #d9e0e0;
    --rf:        #b0561f;
    --mod:       #1c6b78;
    --warn:      #8d2f42;
    --font-display: "IBM Plex Sans Condensed", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
  }
@media (prefers-color-scheme: dark) { svg {
    --ground:    #11161a;
    --surface:   #1a2126;
    --surface-2: #232c32;
    --ink:       #e3e9e9;
    --ink-2:     #a5b2b5;
    --ink-3:     #77878d;
    --line:      #35424a;
    --line-soft: #2a343a;
    --rf:        #e08a4e;
    --mod:       #5cb5c2;
    --warn:      #e0808f;
  } }
svg { color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
.dgm { color: var(--ink); font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; }
.dgm .bx { fill: var(--surface-2); stroke-width: 1.5; }
.dgm .bx-rf { stroke: var(--rf); }
.dgm .bx-mod { stroke: var(--mod); }
.dgm .t-title { font-size: 13px; font-weight: 700; fill: currentColor; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; letter-spacing: 0.02em; }
.dgm .t-sub { font-size: 10px; fill: var(--ink-3); }
.dgm .t-num { font-size: 9px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-3); }
.dgm .t-lvl { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
.dgm .t-lane { font-size: 10px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.14em; }
.dgm .t-note { font-size: 9.5px; fill: var(--ink-3); }
.dgm .ln-rf { stroke: var(--rf); stroke-width: 1.8; fill: none; }
.dgm .ln-mod { stroke: var(--mod); stroke-width: 1.8; fill: none; }
.dgm .ln-dash { stroke: var(--ink-3); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
.dgm .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.sch { color: var(--ink); }
.sch .w { stroke: currentColor; stroke-width: 1.4; fill: none; stroke-linecap: round; }
.sch .cmp { stroke: currentColor; stroke-width: 1.4; fill: var(--surface); }
.sch .cmp-f { stroke: currentColor; stroke-width: 1.4; fill: currentColor; }
.sch .ref { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--rf); }
.sch .val { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--ink-2); }
.sch .nm  { font-size: 11px; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; font-weight: 600; fill: currentColor; }
.sch .nt  { font-size: 9.5px; fill: var(--ink-3); }
.sch .rail { stroke: var(--mod); stroke-width: 2; fill: none; }
.sch .railtx { font-size: 10.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--mod); }
.sch .dot { fill: currentColor; }
</style>
<rect x="0" y="0" width="900" height="210" style="fill:var(--surface)"/>

<defs>
<marker id="cfAr" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10">
<path d="M0,0 L9,5 L0,10 z" fill="currentColor"></path>
</marker>
<g id="gnd">
<line stroke="currentColor" stroke-width="1.4" x1="-9" x2="9" y1="0" y2="0"></line>
<line stroke="currentColor" stroke-width="1.4" x1="-5.5" x2="5.5" y1="4" y2="4"></line>
<line stroke="currentColor" stroke-width="1.4" x1="-2" x2="2" y1="8" y2="8"></line>
</g></defs>
<line class="w" marker-end="url(#cfAr)" x1="24" x2="58" y1="80" y2="80"></line>
<text class="nt" x="24" y="68">IN 50Ω（Si5351A）</text>
<line class="w" x1="58" x2="72" y1="80" y2="80"></line>
<line class="cmp" x1="72" x2="72" y1="66" y2="94"></line>
<line class="cmp" x1="79" x2="79" y1="66" y2="94"></line>
<text class="val" text-anchor="middle" x="75" y="50">1000p</text>
<line class="w" x1="79" x2="144" y1="80" y2="80"></line>
<text class="ref" text-anchor="middle" x="163" y="44">PAD 3dB（実測で調整）</text>
<circle class="dot" cx="110" cy="80" r="2.6"></circle>
<line class="w" x1="110" x2="110" y1="80" y2="110"></line>
<rect class="cmp" height="32" width="14" x="103" y="110"></rect>
<line class="w" x1="110" x2="110" y1="142" y2="170"></line>
<text class="val" text-anchor="end" x="96" y="132">300Ω</text>
<rect class="cmp" height="14" width="40" x="144" y="73"></rect>
<text class="val" text-anchor="middle" x="164" y="64">18Ω</text>
<line class="w" x1="184" x2="320" y1="80" y2="80"></line>
<circle class="dot" cx="216" cy="80" r="2.6"></circle>
<line class="w" x1="216" x2="216" y1="80" y2="110"></line>
<rect class="cmp" height="32" width="14" x="209" y="110"></rect>
<line class="w" x1="216" x2="216" y1="142" y2="170"></line>
<text class="val" text-anchor="end" x="202" y="132">300Ω</text>
<circle class="dot" cx="280" cy="80" r="2.6"></circle>
<line class="w" x1="280" x2="280" y1="80" y2="124"></line>
<line class="cmp" x1="268" x2="292" y1="124" y2="124"></line>
<line class="cmp" x1="268" x2="292" y1="131" y2="131"></line>
<line class="w" x1="280" x2="280" y1="131" y2="170"></line>
<text class="val" x="296" y="132">22p</text>
<path class="w" d="M320,80 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0"></path>
<text class="val" text-anchor="middle" x="355" y="54">47nH</text>
<line class="w" x1="390" x2="470" y1="80" y2="80"></line>
<circle class="dot" cx="430" cy="80" r="2.6"></circle>
<line class="w" x1="430" x2="430" y1="80" y2="124"></line>
<line class="cmp" x1="418" x2="442" y1="124" y2="124"></line>
<line class="cmp" x1="418" x2="442" y1="131" y2="131"></line>
<line class="w" x1="430" x2="430" y1="131" y2="170"></line>
<text class="val" x="446" y="132">22p</text>
<path class="w" d="M470,80 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0"></path>
<text class="val" text-anchor="middle" x="505" y="54">47nH</text>
<line class="w" x1="540" x2="620" y1="80" y2="80"></line>
<circle class="dot" cx="580" cy="80" r="2.6"></circle>
<line class="w" x1="580" x2="580" y1="80" y2="124"></line>
<line class="cmp" x1="568" x2="592" y1="124" y2="124"></line>
<line class="cmp" x1="568" x2="592" y1="131" y2="131"></line>
<line class="w" x1="580" x2="580" y1="131" y2="170"></line>
<text class="val" x="596" y="132">22p</text>
<path class="w" d="M620,80 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0"></path>
<text class="val" text-anchor="middle" x="655" y="54">47nH</text>
<line class="w" marker-end="url(#cfAr)" x1="690" x2="736" y1="80" y2="80"></line>
<text class="nt" x="742" y="76">OUT 50Ω</text>
<text class="nt" x="742" y="90">→ 2SC4703</text>
<line class="w" x1="110" x2="580" y1="170" y2="170"></line>
<use href="#gnd" x="335" y="170"></use>

</svg>
