<path class="w" d="M290,80 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0"></path>
<line class="w" x1="360" x2="440" y1="80" y2="80"></line>
<path class="w" d="M440,80 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0 q8.75,-20 17.5,0"></path>
<line class="w" x1="510" x2="594" y1="80" y2="80"></line>
<line class="w" marker-end="url(#lpAr)" x1="594" x2="640" y1="80" y2="80"></line>
<text class="nt" x="646" y="76">OUT 50Ω → J14（ANT）</text>
<text class="ref" text-anchor="middle" x="175" y="52">L11</text>
<text class="val" text-anchor="middle" x="175" y="40">71 nH</text>
<text class="ref" text-anchor="middle" x="325" y="52">L12</text>
<text class="val" text-anchor="middle" x="325" y="40">78 nH</text>
<text class="ref" text-anchor="middle" x="475" y="52">L13</text>
<text class="val" text-anchor="middle" x="475" y="40">71 nH</text>
<g>
<line class="w" x1="100" x2="100" y1="80" y2="124"></line>
<line class="cmp" x1="88" x2="112" y1="124" y2="124"></line>
<line class="cmp" x1="88" x2="112" y1="131" y2="131"></line>
<line class="w" x1="100" x2="100" y1="131" y2="164"></line>
<text class="ref" text-anchor="end" x="84" y="122">C54</text>
<text class="val" x="116" y="122">22p</text>
</g>
<g>
<line class="w" x1="250" x2="250" y1="80" y2="124"></line>
<line class="cmp" x1="238" x2="262" y1="124" y2="124"></line>
<line class="cmp" x1="238" x2="262" y1="131" y2="131"></line>
<line class="w" x1="250" x2="250" y1="131" y2="164"></line>
<text class="ref" text-anchor="end" x="234" y="122">C55/C56</text>
<text class="val" x="266" y="122">22p × 2</text>
</g>
<g>
<line class="w" x1="400" x2="400" y1="80" y2="124"></line>
<line class="cmp" x1="388" x2="412" y1="124" y2="124"></line>
<line class="cmp" x1="388" x2="412" y1="131" y2="131"></line>
<line class="w" x1="400" x2="400" y1="131" y2="164"></line>
<text class="ref" text-anchor="end" x="384" y="122">C57/C58</text>
<text class="val" x="416" y="122">22p × 2</text>
</g>
<g>
<line class="w" x1="550" x2="550" y1="80" y2="124"></line>
<line class="cmp" x1="538" x2="562" y1="124" y2="124"></line>
<line class="cmp" x1="538" x2="562" y1="131" y2="131"></line>
<line class="w" x1="550" x2="550" y1="131" y2="164"></line>
<text class="ref" text-anchor="end" x="534" y="122">C59</text>
<text class="val" x="566" y="122">22p</text>
</g>
<line class="w" x1="100" x2="550" y1="164" y2="164"></line>
<use href="#gnd" x="325" y="164"></use>

</svg>
